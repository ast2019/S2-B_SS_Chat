services:
  songbird:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: songbird
    restart: unless-stopped
    expose:
      - "${SERVER_PORT:-5174}"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: ${SERVER_PORT:-5174}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - songbird-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');h.get('http://localhost:${SERVER_PORT:-5174}/api/health',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>{process.exit(JSON.parse(d).ok?0:1)})}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./certs/key.pem:/etc/nginx/certs/key.pem:ro
    depends_on:
      songbird:
        condition: service_healthy

volumes:
  songbird-data:
